      color: #fff !important;
      background: radial-gradient(circle at 35% 28%, #8fbcff, #2a6ae8 55%, #0a3ca8) !important;
      box-shadow: inset 0 0 0 2px #dfe6ff, 0 0 0 1px #1b2358, 0 2px 3px rgba(0, 0, 40, 0.6) !important;
    }
    :host(.type-media-control) .controls ha-icon-button:active,
    :host(.type-media-control) .more-info:active {
