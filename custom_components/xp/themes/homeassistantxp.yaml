    "$ ha-bottom-sheet $": |
      /* Handy: Der Dialog kommt als Bottom-Sheet von unten. Den Zieh-Griff
         über die Titelleiste stellen statt darauf (sonst verdeckt er den Titel). */
      .handle-wrapper {
        position: static !important;
      }
    "ha-alert $": |
      /* Hinweise (ha-alert) mit eingeritztem XP-Rahmen und den
         Symbolen aus den XP-Meldungsfenstern */
      .issue-type {
        padding: 8px 10px !important;
        color: var(--xp-text);
        box-shadow: inset 1px 1px var(--xp-shadow), inset -1px -1px var(--xp-highlight), inset 2px 2px var(--xp-highlight), inset -2px -2px var(--xp-shadow);
      }
      .issue-type::after {
        display: none !important;
      }
      .icon {
        width: 32px !important;
        height: 32px !important;
        flex: none;
        background: var(--xp-icon-info) center / 32px no-repeat;
      }
      .icon ::slotted(*),
      .icon > slot > * {
        visibility: hidden !important;
      }
      .issue-type.warning > .icon {
        background-image: var(--xp-icon-warning);
      }
      .issue-type.error > .icon {
        background-image: var(--xp-icon-error);
      }
      .issue-type.success > .icon {
        background-image: var(--xp-icon-success);
      }
      .main-content {
        margin-inline: 12px 8px !important;
      }
  uix-toast-yaml: |
    .: |
      /* Knopf in der Meldung als XP-Schaltfläche */
      ha-toast ha-button::part(base) {
        min-width: 75px;
        height: 23px;
        min-height: 0;
        padding: 0 12px;
        border: none !important;
        border-radius: var(--xp-radius) !important;
        background: var(--xp-face) !important;
        color: var(--xp-text) !important;
        box-shadow: var(--xp-raised) !important;
        font-family: var(--xp-font);
        font-size: 13px;
        font-weight: normal;
      }
      ha-toast ha-button:active::part(base) {
        box-shadow: var(--xp-sunken) !important;
      }
      ha-toast ha-icon-button {
        color: var(--xp-text) !important;
      }
    $: |
      /* Meldung unten als graues XP-Fenster mit Info-Symbol */
      .toast {
        min-height: 0 !important;
        padding: 10px 10px 10px 54px !important;
        border-radius: 6px !important;
        background: var(--xp-icon-info) 12px center / 32px no-repeat, var(--xp-face) !important;
        color: var(--xp-text) !important;
        box-shadow: var(--xp-raised), 2px 2px 0 rgba(0, 0, 0, 0.35) !important;
        font-family: var(--xp-font);
      }
      .actions {
        color: var(--xp-text) !important;
      }
  card-mod-sidebar: |
    :host {
      border-right: none !important;
      box-shadow: var(--xp-raised);
    }
    .title {
      font-weight: bold;
    }
    /* Markierter Eintrag: blaue Fläche mit weißer Schrift. HA zeichnet sonst nur
       einen Schleier in der Textfarbe (bei weißer Markierungsschrift also weiß) */
    ha-list-item-button.selected {
      background: var(--xp-select) !important;
      border-radius: 2px;
    }
    ha-list-item-button.selected::before {
      display: none !important;
    }
    ha-list-item-button.selected::part(headline),
    ha-list-item-button.selected .item-text {
      color: var(--xp-select-text) !important;
    }
    /* Menü-Knopf oben links: 48 px ragten über die 36 px hohe Kopfzeile hinaus */
    .menu ha-icon-button {
      --ha-icon-button-size: 28px;
      --mdc-icon-size: 18px;
      margin-left: 4px;
    }
    /* Schrift auch in den Einträgen (HA setzt dort fest Roboto) */
    .item-text,
    .badge,
    .initials,
    .xp-sb-arrow,
    .title {
      font-family: var(--xp-font) !important;
    }
    .item-text {
      font-size: 13px !important;
      font-weight: normal !important;
    }
    /* Zähler (z. B. Benachrichtigungen): die Pixel-Ziffer sitzt im Kasten
       einen halben Pixel zu hoch und links, daher ungleiche Innenabstände */
    .badge[slot=end] {
      padding: 2px 6px 1px 7px !important;
    }
    /* ... und im Untertext der Einträge (z. B. Temperaturen bei Heizung) */
    ha-list-item-button {
      --md-list-item-supporting-text-font: var(--xp-font);
      --md-list-item-supporting-text-size: 11px;
      --md-list-item-label-text-font: var(--xp-font);
      --md-list-item-trailing-supporting-text-font: var(--xp-font);
    }
