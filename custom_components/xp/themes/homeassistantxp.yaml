      flex: none;
      margin: 0 !important;
      padding: 0 0 6px !important;
      height: 46px;
      align-items: center;
      color: #1c2a6e;
    }
    :host(.type-media-control) .controls .start,
    :host(.type-media-control) .controls .end {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    :host(.type-media-control) .controls .end {
      margin-left: auto;
    }
    /* Runde Knöpfe wie im Media Player: silbrig blau, Wiedergabe groß und blau */
    :host(.type-media-control) .controls ha-icon-button,
    :host(.type-media-control) .more-info {
      --ha-icon-button-size: 28px !important;
      --mdc-icon-button-size: 28px !important;
      --mdc-icon-size: 16px;
      width: 28px !important;
      height: 28px !important;
      border-radius: 50% !important;
      color: #1c2a6e !important;
      background: radial-gradient(circle at 35% 30%, #f4f6ff, #a8b1e2 55%, #6a74bd) !important;
      box-shadow: inset 0 0 0 1px #3a4488, 0 1px 2px rgba(0, 0, 40, 0.5) !important;
    }
    :host(.type-media-control) .controls ha-icon-button[action="media_play_pause"] {
      --ha-icon-button-size: 42px !important;
      --mdc-icon-button-size: 42px !important;
