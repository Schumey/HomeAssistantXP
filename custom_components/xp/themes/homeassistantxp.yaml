      right: 12px !important;
    }
    :host(.type-media-control) .background .image {
      background-color: #000 !important;
    }
    :host(.type-media-control) .player {
      padding: 6px !important;
      min-height: 216px;
      color: #fff !important;
    }
    :host(.type-media-control) .top-info,
    :host(.type-media-control) .media-info {
      padding: 0 8px;
      color: #fff;
    }
    :host(.type-media-control) .top-info {
      margin-top: 4px;
    }
    :host(.type-media-control) .media-info {
      font-family: var(--xp-font);
      font-size: 15px;
    }
    :host(.type-media-control) .media-info * {
      color: #fff !important;
    }
    /* Titel, Suchleiste und Werkzeugleiste untereinander */
    :host(.type-media-control) .player > div:nth-child(2) {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
    }
    :host(.type-media-control) .title-controls {
      display: contents !important;
    }
    :host(.type-media-control) .media-info {
      order: 0;
      flex: 1 1 auto;
      margin-top: 8px;
    }
    :host(.type-media-control) ha-slider {
      order: 1;
      flex: none;
      margin: 6px -6px 0;
      padding: 0 6px;
      /* HA setzt width: 100%; so reicht die Leiste mit den -6px bis unter die Videofläche */
      width: auto !important;
      align-self: stretch;
      height: 30px !important;
      --thumb-width: 11px;
      --thumb-height: 19px;
    }
    :host(.type-media-control) ha-slider::part(track) {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(180deg, #7a84c4, #dfe3f7);
      box-shadow: inset 0 0 0 1px #3a4488;
    }
    :host(.type-media-control) ha-slider::part(indicator) {
      background: transparent;
    }
    /* HA blendet den Schieber in der Medienkarte aus */
    :host(.type-media-control) ha-slider::part(thumb) {
      display: block !important;
      border: 1px solid #3a4488;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #b9c1ea 60%, #8590d0);
      box-shadow: none;
    }
    :host(.type-media-control) .controls {
