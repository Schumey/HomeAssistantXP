      background: var(--xp-mp-skin, linear-gradient(180deg, #aab2e2 0%, #7f89cb 35%, #5b66b0 100%)) !important;
    }
    /* Videofläche: schwarz, eingelassen */
    :host(.type-media-control) .background {
