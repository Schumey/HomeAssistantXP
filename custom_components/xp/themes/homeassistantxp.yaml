    }
    /* Mehr-Info-Knopf: in die Werkzeugleiste, links neben den Medienquellen-Knopf */
    :host(.type-media-control) .top-info > div:last-child {
      position: absolute;
      right: 40px;
      bottom: 24px;
      width: 28px;
      height: 28px;
      z-index: 1;
    }
