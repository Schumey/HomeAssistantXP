    "hui-card-features $$ ha-control-slider $": |
      /* Regler (ha-control-slider) als XP-Fortschrittsbalken: weißes,
         eingelassenes Feld, Blöcke in der Markierungsfarbe, kein Griff */
      :host {
        --control-slider-border-radius: var(--xp-radius);
        --control-slider-background: transparent;
        --control-slider-background-opacity: 0;
      }
      .container {
        box-sizing: border-box;
        padding: 2px;
        background: var(--xp-window);
        box-shadow: var(--xp-sunken);
      }
      .slider {
        border-radius: var(--xp-radius) !important;
