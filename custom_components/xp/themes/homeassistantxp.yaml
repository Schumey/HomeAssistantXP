  uix-dialog-yaml: |
    .: |
      /* Rahmen als Überlagerung statt als inset-Schatten: eine Fußzeile mit
         eigenem Hintergrund (z. B. Update-Dialog) überdeckte sonst den
         unteren Rand */
      wa-dialog::part(dialog) {
        position: relative;
        box-shadow: none !important;
        background: var(--xp-face) !important;
        border-radius: var(--xp-radius-window) !important;
        overflow: hidden;
      }
      /* Fußzeile füllt die Breite des Fensters und liegt unter dem Rahmen */
      wa-dialog::part(footer) {
        position: relative;
        z-index: 0;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        background: var(--xp-face);
      }
      wa-dialog::part(dialog)::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        box-shadow: var(--dialog-box-shadow, var(--xp-frame));
        border-radius: var(--xp-radius-window);
      }
      /* Symbole in Dialog-Listen (z. B. Neustart): eckige statt runde Scheiben,
         Zeilentexte in Schrift */
      .icon-background {
        border-radius: var(--xp-radius) !important;
      }
      ha-list-item-button {
        --md-list-item-label-text-font: var(--xp-font);
        --md-list-item-label-text-size: 13px;
        --md-list-item-supporting-text-font: var(--xp-font);
        --md-list-item-supporting-text-size: 11px;
        --md-list-item-trailing-supporting-text-font: var(--xp-font);
      }
      /* Schließen-Knopf der Rückfrage-Dialoge (waren 48 px): klein wie im
         Info-Dialog */
      ha-dialog-header ha-icon-button[data-dialog=close] {
        --ha-icon-button-size: 21px;
        --mdc-icon-size: 12px;
        --ha-button-box-shadow: none;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 21px !important;
        height: 21px !important;
        color: #fff !important;
        background: linear-gradient(180deg, #ee9a82, #c43a1a);
        box-shadow: none;
        border: 1px solid #fff;
        box-sizing: border-box;
        border-radius: var(--xp-radius);
      }
      /* Dialoge, die ihre Kopf-Knöpfe selbst mitbringen (z. B. "Karte
         bearbeiten"): sie liegen im Light-DOM von ha-dialog und sind nur über
         ::slotted erreichbar. Schließen-Knopf klein in der Titelleiste, die
         Knöpfe der Symbolleiste (Hilfe) wie im Info-Dialog 24×22. */
      slot[name=headerNavigationIcon]::slotted(ha-icon-button) {
        --ha-icon-button-size: 21px;
        --mdc-icon-size: 12px;
        --ha-button-box-shadow: none;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 21px !important;
        height: 21px !important;
        color: #fff !important;
        background: linear-gradient(180deg, #ee9a82, #c43a1a);
        box-shadow: none;
        border: 1px solid #fff;
        box-sizing: border-box;
        border-radius: var(--xp-radius);
      }
      slot[name=headerActionItems]::slotted(ha-icon-button) {
        --ha-icon-button-size: 22px;
        --mdc-icon-size: 16px;
        --ha-button-box-shadow: none;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 24px !important;
        height: 22px !important;
        color: var(--xp-text) !important;
        background: transparent;
        box-shadow: none;
        border-radius: var(--xp-radius);
      }
      slot[name=headerNavigationIcon]::slotted(ha-icon-button:active),
      slot[name=headerActionItems]::slotted(ha-icon-button:active) {
        box-shadow: var(--xp-sunken);
      }
      /* Dialoge mit eigenem Menü-Knopf (z. B. Medienquellen): Knopf in
         Symbolleistengröße, Schließen-Knopf in die Titelleiste (absolut
         über den Kopf; -3px gleicht den Rand von ::slotted(*) aus) */
      ha-dialog-header ha-dropdown ha-icon-button {
        --ha-icon-button-size: 22px;
        --mdc-icon-size: 16px;
      }
      ha-dialog-header ha-icon-button[data-dialog=close][slot=actionItems] {
        position: absolute !important;
        top: -3px !important;
        right: 5px !important;
      }
      /* Benachrichtigungen (Seitenschublade): Titelleiste wie bei den
         Fenstern (Verlauf, Schrift), der Zurück-Knopf wird zum X */
      ha-drawer.type-notification-drawer ha-header-bar {
        --ha-icon-button-size: 18px;
      }
      ha-drawer.type-notification-drawer ha-header-bar [slot=title] {
        font-family: var(--xp-font);
        font-size: 13px;
        font-weight: bold;
        line-height: 22px;
        color: var(--xp-title-text);
      }
      ha-drawer.type-notification-drawer .notifications {
        font-family: var(--xp-font);
        font-size: 13px;
      }
      /* Titel, den der Dialog selbst in die Titelleiste legt */
      ha-dialog-header [slot=title] {
        margin: 0 !important;
        padding: 0 !important;
        font-family: var(--xp-font) !important;
        font-size: 13px !important;
        font-weight: bold !important;
        line-height: 22px !important;
        letter-spacing: 0 !important;
        color: var(--xp-title-text) !important;
        font-family: var(--xp-font-title) !important;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* OK/Abbrechen als XP-Schaltflächen (75×23), die Hauptaktion mit
         schwarzem Rand wie die Standard-Schaltfläche */
      ha-dialog-footer ha-button::part(base),
      ha-button[slot$=Action]::part(base) {
        min-width: 75px;
        height: 23px;
        min-height: 0;
        padding: 0 12px;
        border: none !important;
        border-radius: var(--xp-radius) !important;
        background: var(--xp-face) !important;
        color: var(--xp-text) !important;
        box-shadow: var(--xp-raised) !important;
        font-family: var(--xp-font);
        font-size: 13px;
        font-weight: normal;
        transition: none;
      }
      ha-dialog-footer ha-button[slot=primaryAction]::part(base),
      ha-button[slot=primaryAction]::part(base) {
        box-shadow: inset 0 0 0 1px var(--xp-dark), inset -2px -2px var(--xp-dark), inset 2px 2px var(--xp-highlight), inset -3px -3px var(--xp-shadow), inset 3px 3px var(--xp-light) !important;
      }
      ha-dialog-footer ha-button:active::part(base),
      ha-button[slot=primaryAction]::part(base) {
        box-shadow: inset 0 0 0 1px var(--xp-border), inset 0 0 0 2px var(--xp-glow), inset 0 0 0 3px var(--xp-highlight), inset 0 -5px 4px -3px var(--xp-shadow) !important;
      }
      ha-button[slot$=Action]:hover::part(base) {
        box-shadow: inset 0 0 0 1px var(--xp-border), inset 0 0 0 2px var(--xp-hot), inset 0 0 0 3px color-mix(in srgb, var(--xp-hot) 35%, #fff) !important;
      }
      ha-button[slot$=Action]:active::part(base) {
        box-shadow: inset 0 0 0 1px var(--xp-dark), inset 0 0 0 2px var(--xp-shadow) !important;
        padding: 2px 11px 0 13px;
      }
      ha-dialog-footer ha-button::part(base):focus-visible,
      ha-button[slot$=Action]::part(base):focus-visible {
        outline: 1px dotted var(--xp-text) !important;
        outline-offset: -5px !important;
      }
      ha-dialog-footer ha-button[disabled]::part(base),
      ha-button[slot$=Action][disabled]::part(base) {
        color: var(--xp-disabled) !important;
        text-shadow: 1px 1px var(--xp-highlight);
      }
      /* Schnellsuche als XP-Dialog "Ausführen": Titelleiste */
      ha-adaptive-dialog.type-quick-bar ha-picker-combo-box::before {
        content: "Run";
        display: block;
        margin: 3px 3px 0;
        padding: 2px 4px;
        height: 18px;
        background: var(--xp-title-bar);
        border-radius: var(--xp-radius-title);
        color: var(--xp-title-text);
        font-family: var(--xp-font);
        font-size: 13px;
        font-weight: bold;
        line-height: 22px;
        text-align: var(--xp-title-align, left);
      }
      ha-adaptive-dialog.type-quick-bar ha-picker-combo-box:lang(de)::before {
        content: "Ausführen";
      }
      /* Titelleiste ganz oben im Fenster (ohne den Innenabstand von 16 px)
         und Schließen-Knopf rechts darin (nur das X aus dem Knopfbild) */
      ha-adaptive-dialog.type-quick-bar ha-picker-combo-box {
        position: relative;
        padding-top: 0 !important;
      }
      ha-adaptive-dialog.type-quick-bar ha-picker-combo-box::after {
        content: "";
        position: absolute;
        right: 5px;
        top: 6px;
        width: 16px;
        height: 16px;
